<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juegos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&display=swap">
<style>
:root{--bg:#ECEEE8;--surface:#F8F9F4;--ink:#13231B;--muted:#5A6A60;--line:#CDD5CA;--brass:#B87A0B}
@media (prefers-color-scheme:dark){:root{--bg:#0D1411;--surface:#151F1A;--ink:#E6ECE5;--muted:#93A399;--line:#28362E;--brass:#E7AF3C;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;padding:40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,8vw,72px);margin:0;line-height:.95}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
a.card:hover{border-color:var(--brass)}
a.card h2{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:32px;margin:0 0 6px;color:var(--brass)}
a.card p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Juegos</h1>
<a class="card" href="/casa-de-subasta/"><h2>Casa de Subasta</h2><p>Subasta de fútbol, básquetbol o temática libre en una sola pantalla: pujas de 5 segundos, intercambios, ruleta y ranking final.</p></a>
</main>
</body>
</html>
