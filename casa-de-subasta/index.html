<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa de Subasta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sala de subastas en una sola pantalla. Escenario (ficha + martillo) a la izquierda, filas de postores a la derecha; en móvil se apilan. */
:root{
  --bg:#AFC2B0; --surface:#F7F8F3; --sunk:#E3E8DE; --ink:#13231B; --muted:#46564C; --line:#B8C6B6;
  --accent:#1D5A43; --accent-ink:#F3F7F2; --brass:#B87A0B; --brass-soft:#F3E4C2; --good:#2B7A4B; --bad:#B23E2B;
  --w1:#2B7A4B; --w2:#B23E2B; --w3:#C46A1A; --w4:#6B3FA0; --s1:#1D5A43; --s2:#3E7F66;
  --shadow:0 1px 2px rgba(19,35,27,.08),0 8px 24px rgba(19,35,27,.08);
  --glow1:rgba(214,150,30,.45); --glow2:rgba(20,70,50,.40); --deco:rgba(19,45,32,.10); --deco-field:rgba(245,250,240,.42); --beam:rgba(255,238,195,.40); --vignette:rgba(14,40,28,.38);
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#151F1A; --sunk:#0A100D; --ink:#E6ECE5; --muted:#93A399; --line:#28362E;
  --accent:#5CC497; --accent-ink:#06140D; --brass:#E7AF3C; --brass-soft:#3A2C0E; --good:#5CC497; --bad:#EE7C63;
  --w1:#2F8A57; --w2:#B94733; --w3:#C7751F; --w4:#7A4DB5; --s1:#24664D; --s2:#3B8A6C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --glow1:rgba(231,175,60,.16); --glow2:rgba(92,196,151,.12); --deco:rgba(230,236,229,.05); --deco-field:rgba(92,196,151,.10); --beam:rgba(231,175,60,.09); --vignette:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1A; --sunk:#0A100D; --ink:#E6ECE5; --muted:#93A399; --line:#28362E;
  --accent:#5CC497; --accent-ink:#06140D; --brass:#E7AF3C; --brass-soft:#3A2C0E; --good:#5CC497; --bad:#EE7C63;
  --w1:#2F8A57; --w2:#B94733; --w3:#C7751F; --w4:#7A4DB5; --s1:#24664D; --s2:#3B8A6C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --glow1:rgba(231,175,60,.16); --glow2:rgba(92,196,151,.12); --deco:rgba(230,236,229,.05); --deco-field:rgba(92,196,151,.10); --beam:rgba(231,175,60,.09); --vignette:rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:600}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.brass{background:var(--brass);color:#1E1300;border-color:var(--brass)}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button.ghost{background:transparent}
button.big{padding:14px 22px;font-size:17px}
button.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:12px;font-weight:600;white-space:nowrap}
.chip.brass{background:var(--brass-soft);color:var(--ink)}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.err{color:var(--bad);font-weight:600;font-size:13px;min-height:1.2em}

/* Marca */
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.brand h1 span{color:var(--brass)}
.lot{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Setup */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.theme-card{text-align:left;padding:22px;border-radius:14px;display:flex;flex-direction:column;gap:8px;min-height:170px;background:var(--surface)}
.theme-card .display{font-size:36px}
.theme-card.on{border:2px solid var(--brass);background:var(--brass-soft)}
.pool-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;max-height:520px;overflow:auto;padding:2px}
.pool label{flex-direction:row;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;cursor:pointer}
.pool label input{margin-top:3px;accent-color:var(--accent)}
.pool label b{font-weight:700}
.pool small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .prow-in{display:flex;gap:8px;align-items:center}
.plist .prow-in .n{font-family:var(--f-mono);color:var(--muted);width:2.2em;text-align:right}
.plist .prow-in input{flex:1}
.custom-list{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto}
.custom-list div{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.custom-list div span{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* Juego */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.counters{display:flex;gap:8px;flex-wrap:wrap}
.counter{display:flex;flex-direction:column;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:96px}
.counter b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.counter small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.board{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.stage{position:static}}
.lotcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.lotcard .name{font-family:var(--f-display);font-size:clamp(34px,4.4vw,52px);text-transform:uppercase;line-height:.95;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fact{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.fact small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fact span{font-weight:600;overflow-wrap:anywhere}
.tray{font-size:14px;color:var(--muted)}
.auction{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.clock{--p:1;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--brass) calc(var(--p)*360deg),var(--sunk) 0)}
.clock div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.clock.hot{background:conic-gradient(var(--bad) calc(var(--p)*360deg),var(--sunk) 0)}
.clock.hot div{color:var(--bad)}
.highbid small{display:block}
.highbid .amt{font-family:var(--f-mono);font-size:clamp(30px,4vw,44px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.highbid .who{font-size:18px;font-weight:700;color:var(--accent)}
.sold-banner{font-family:var(--f-display);font-size:clamp(40px,6vw,64px);text-transform:uppercase;color:var(--brass);line-height:.9}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.compare b{font-family:var(--f-mono);font-size:22px;display:block}
.market{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow:auto}
.mitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mitem div{flex:1;min-width:0}
.mitem small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidders{display:flex;flex-direction:column;gap:10px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s, box-shadow .2s}
.prow.lead{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-soft)}
.phead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pname{font-family:var(--f-display);font-size:26px;text-transform:uppercase;line-height:1}
.pcash{font-family:var(--f-mono);font-weight:700;font-size:18px;color:var(--accent)}
.bidbox{display:flex;gap:6px;margin-left:auto}
.bidbox input{width:110px;font-family:var(--f-mono)}
.bidbox .up{white-space:nowrap;font-family:var(--f-mono);font-weight:700}
.key{font-family:var(--f-mono);font-size:12px;font-weight:700;min-width:24px;height:24px;display:inline-grid;place-items:center;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:var(--sunk);color:var(--muted)}
@media (max-width:520px){.bidbox{margin-left:0;width:100%;flex-wrap:wrap}.bidbox input{flex:1;width:auto}.bidbox .up{flex:1 1 100%}}
.team{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.team li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.team li .t-name{font-weight:600;overflow-wrap:anywhere}
.team li .t-name small{color:var(--muted);font-weight:500;margin-left:6px}
.team li .t-val{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.team li .t-val em{font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:11px;margin-right:4px}
@media (max-width:520px){.team li{grid-template-columns:minmax(0,1fr) auto}.team li .t-name{grid-column:1/-1}}
.mkt-edit{display:flex;align-items:center;gap:4px}
.mkt-edit input{font-family:var(--f-mono);font-size:20px;font-weight:700;width:100%;padding:4px 8px;background:var(--surface)}
.mkt-btn{font:inherit;font-family:var(--f-mono);font-size:13px;padding:0 2px;border:0;border-bottom:1px dashed var(--muted);border-radius:0;background:none;color:var(--ink);font-weight:500}
.mkt-btn:hover{color:var(--accent);border-bottom-color:var(--accent)}
.mkt-inline{width:90px;font-family:var(--f-mono);font-size:13px;padding:2px 6px}
.empty-team{color:var(--muted);font-size:13px;font-style:italic}
.pfoot{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.flash{animation:flash .6s ease-out}
@keyframes flash{from{background:var(--brass-soft)}to{background:var(--surface)}}

/* Fondo decorado: focos, patrón de martillos y paletas, y la cancha según la temática */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,transparent 45%,var(--vignette) 100%),radial-gradient(55% 45% at 10% -8%,var(--glow1),transparent 70%),radial-gradient(50% 45% at 100% 108%,var(--glow2),transparent 70%),radial-gradient(40% 30% at 90% 0%,var(--glow2),transparent 70%)}
#bg .pat{position:absolute;inset:0;background:var(--deco);-webkit-mask-image:var(--pat);mask-image:var(--pat);-webkit-mask-size:190px;mask-size:190px;-webkit-mask-repeat:repeat;mask-repeat:repeat}
#bg .field{position:absolute;inset:7% 3%;background:var(--deco-field);-webkit-mask-image:var(--field);mask-image:var(--field);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
#bg .beam{position:absolute;top:-20%;width:38vw;height:150%;background:linear-gradient(180deg,var(--beam),transparent 75%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);transform-origin:50% 0;filter:blur(6px)}
#bg .b1{left:4%;animation:sway1 14s ease-in-out infinite alternate}
#bg .b2{right:6%;animation:sway2 17s ease-in-out infinite alternate}
@keyframes sway1{from{transform:rotate(-16deg)}to{transform:rotate(8deg)}}
@keyframes sway2{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}
.wrap{position:relative;z-index:1}
#music{position:fixed;z-index:60;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 6px;box-shadow:var(--shadow)}
#music button{border-radius:999px;display:flex;gap:6px;align-items:center;padding:7px 12px}
#music button svg{width:16px;height:16px;fill:currentColor}
#music button.on{background:var(--brass);border-color:var(--brass);color:#1E1300}
#music input{width:90px;padding:0;accent-color:var(--brass)}

/* Overlays */
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(4px);overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 84px) max(16px,env(safe-area-inset-left,0px))}
.sheet{max-width:1040px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,44px);text-transform:uppercase;line-height:1}
.bigclock{font-family:var(--f-mono);font-size:clamp(44px,8vw,80px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bigclock.over{color:var(--bad)}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.trade{grid-template-columns:1fr}}
.side{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--bg) 30%,var(--surface))}
.side .checks{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.side .checks label{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.confirm{display:flex;flex-direction:row;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--sunk);font-weight:700}
.confirm input{width:20px;height:20px;accent-color:var(--good)}
.summary{padding:12px 14px;border-radius:10px;background:var(--brass-soft);font-weight:500}
.wheel-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:700px){.wheel-wrap{grid-template-columns:1fr}}
.wheel-box{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto}
.wheel-box canvas{width:100%;height:100%;display:block}
.wheel-box .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink)}
.order{display:flex;gap:6px;flex-wrap:wrap}
.order span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.order span.now{background:var(--brass);color:#1E1300}
.order span.done{text-decoration:line-through}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.result{font-size:20px;font-weight:700;padding:14px;border-radius:12px;background:var(--sunk)}
.log{display:flex;flex-direction:column;gap:0;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.log div{display:grid;grid-template-columns:3.2em 4.6em 7.5em minmax(0,1fr);gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.log div:nth-child(odd){background:var(--bg)}
.log .k{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
@media (max-width:620px){.log div{grid-template-columns:3em minmax(0,1fr)}.log div .tm{display:none}.log div .k{grid-column:2}.log div .tx{grid-column:2}}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line))}

/* Final */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cat{display:flex;flex-direction:column;gap:10px}
.cat .winner{font-family:var(--f-display);font-size:34px;text-transform:uppercase;color:var(--brass);line-height:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ai-item{padding:10px 0;border-bottom:1px dashed var(--line)}
.ai-item b{font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="bg" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div><div class="pat"></div><div class="field"></div></div>

function nice(x){ if(x<=0) return 0; if(x<10) return Math.max(1,Math.round(x)); const mag=Math.pow(10,Math.floor(Math.log10(x))-1); return Math.round(x/mag)*mag; }

/* Precio de mercado: según la calidad (72–99) y el dinero inicial. Un crack de 99 vale ~42 % del presupuesto. */
function marketPrice(r, cash0){
  if (r==null) return null;
  const q = Math.max(0, Math.min(1, (r-72)/27));
  return nice(cash0 * (0.02 + 0.40*Math.pow(q,2.3)));
}

/* ---------- Render principal ---------- */
function render(){
  const keep = {}; document.querySelectorAll("input[id],select[id],textarea[id]").forEach(el=>{ if(el.type!=="checkbox") keep[el.id]=el.value; });
  const focus = document.activeElement?.id;
  const app = $("#app");
  app.innerHTML = S.phase==="setup" ? viewSetup() : S.phase==="game" ? viewGame() : viewFinal();
  renderOverlay();
  for (const id in keep){ const el=document.getElementById(id); if(el && el.dataset.keep!=="no" && el.type!=="checkbox") el.value=keep[id]; }
  if (focus){ const el=document.getElementById(focus); if(el && el.focus) el.focus({preventScroll:true}); }
  if (UI.flash){ document.getElementById("row-"+UI.flash)?.classList.add("flash"); UI.flash=null; }
  drawWheelIfAny();
  paintBg();
  save();
}

    body = `<div class="panel" style="display:flex;flex-direction:column;gap:12px"><div><div class="eyebrow">Paso 2 · ${THEMES[S.theme].label}</div>

/* ---------- Juego ---------- */
function untilNext(n){ const r = n - (S.sales % n); return r; }

    const p=P(S.sold.pid); let cmp="";
    {

      ${S.cur.bids.length?`<div class="muted" style="font-size:13px">Pujas: ${S.cur.bids.slice(-6).map(b=>`${esc(P(b.pid).name)} ${fmt(b.amt)}`).join(" → ")}</div>`:""}</div>`;

    <div class="row"><button class="brass big" data-act="randomPick" ${S.market.length&&!blocked?"":"disabled"}>Ficha al azar</button><span class="muted">${S.market.length} en el mercado</span></div>
    <div class="market">${S.market.length?S.market.map(id=>{const f=F(id);return `<div class="mitem"><div><b>${esc(f.name)}</b> ${f.legend?'<span class="chip brass">Leyenda</span>':""}<small>${f.r!=null?`${esc(f.pos)} · ${esc(f.team)} · ${f.h} m`:esc(f.desc||"Personaje")}</small></div><button class="sm" data-act="pickF" data-id="${id}">Subastar</button></div>`}).join(""):`<p class="muted">El mercado está vacío. Añade más fichas o termina el juego.</p>`}</div>

function addBox(){

}
function contLabel(){ const e=S.pending[0]; return e==="ruleta"?"Continuar a la ruleta →":e==="break"?"Continuar a los intercambios →":"Siguiente ficha →"; }
function teamList(p){
  if (!p.fichas.length) return `<p class="empty-team" style="margin:0">Sin fichas todavía</p>`;

}
function viewPostor(p){
  const open = S.cur?.open && !S.cur.paused; const hb=S.cur?.bids[S.cur.bids.length-1];
  const lead = hb && hb.pid===p.id;

  const next = (hb?hb.amt:0)+1; const canUp = open && !lead && p.cash>=next;

    <div class="bidbox"><input id="bid-${p.id}" type="number" min="1" step="1" inputmode="numeric" placeholder="Cantidad" data-keep="${open?"":"no"}" ${open?"":"disabled"} data-enter="bid" data-id="${p.id}"><button class="primary" data-act="bid" data-id="${p.id}" ${open?"":"disabled"}>Pujar</button><button class="brass up" data-act="up" data-id="${p.id}" ${canUp?"":"disabled"} title="${lead?"Ya va ganando":p.cash<next?"No le alcanza el dinero":""}">${hb?`Superar → ${fmt(next)}`:`Pujar ${fmt(next)}`}</button></div></div>

/* ---------- Subasta ---------- */
function pickFicha(id){
  if (S.cur || S.sold || S.pending.length) return;
  S.market = S.market.filter(x=>x!==id); S.cur={fid:id, bids:[], open:false, paused:false}; render();
}
function openAuction(){ S.cur.open=true; S.cur.paused=false; S.cur.deadline=now()+S.firstSecs*1000; render(); $("#bid-"+S.postores[0].id)?.focus(); }
function placeBid(pid, quick){
  const c=S.cur; if(!c?.open || c.paused) return;
  const input=$("#bid-"+pid); const hb0=c.bids[c.bids.length-1];
  const amt = quick ? (hb0?hb0.amt:0)+1 : Math.floor(Number(input?.value));
  const p=P(pid); const hb=c.bids[c.bids.length-1];
  const fail = m => { if(quick){ UI.flash=null; return; } input.setCustomValidity(m); input.reportValidity(); setTimeout(()=>input.setCustomValidity(""),1500); };
  if (!amt || amt<1) return fail("Escribe una cantidad mayor que 0.");
  if (hb && amt<=hb.amt) return fail(`Tiene que superar ${fmt(hb.amt)}.`);
  if (amt>p.cash) return fail(`${p.name} solo tiene ${fmt(p.cash)}.`);
  if (hb && hb.pid===pid) return fail(`${p.name} ya va ganando.`);
  c.bids.push({pid, amt}); c.deadline=now()+S.bidSecs*1000; if(!quick) input.value=""; UI.flash=pid; render();
}
function closeAuction(){
  const c=S.cur; if(!c) return; const f=F(c.fid); const hb=c.bids[c.bids.length-1];
  if (hb){
    const p=P(hb.pid); p.cash-=hb.amt; p.fichas.push(f.id); f.owner=p.id; f.acq="compra"; f.paid=hb.amt; f.value=hb.amt;
    S.sales++; S.sold={fid:f.id, pid:p.id, amt:hb.amt}; Music.gavel();
    log("Compra", `${p.name} compra a ${f.name} por ${fmt(hb.amt)}${f.mkt!=null?` (mercado sugerido ${fmt(f.mkt)})`:""}.`);
    if (S.sales%15===0) S.pending.push("ruleta");
    if (S.sales%10===0) S.pending.push("break");
  } else {
    S.market.push(f.id); S.sold={fid:f.id, none:true}; log("Sin pujas", `${f.name} no recibió pujas y vuelve al mercado.`);
  }
  S.cur=null; render();
}
function continueFlow(){
  S.sold=null; const e=S.pending.shift();
  if (e==="ruleta"){ S.rulRound++; S.rul={order:shuffle(S.postores.map(p=>p.id)), idx:0, stage:"main", sub:null, result:null}; UI.rot=0; }
  if (e==="break"){ S.brkRound++; S.brk={deadline:now()+S.breakSecs*1000, paused:false, over:false, done:[]}; UI.T=null; }
  render();
}
function tick(){
  const c=S.cur;
  if (c?.open){
    const total = (c.bids.length?S.bidSecs:S.firstSecs)*1000;
    const rem = c.paused ? c.remaining : c.deadline-now();
    const el=$("#clockN"), ring=$("#clock");
    if (el){ el.textContent = Math.max(0,rem/1000).toFixed(1); ring.style.setProperty("--p", Math.max(0,Math.min(1,rem/total))); ring.classList.toggle("hot", rem<2000); }
    if (!c.paused && rem<=0) closeAuction();
  }
  const b=S.brk;
  if (b && !b.over){
    const rem = b.paused ? b.remaining : b.deadline-now();
    const el=$("#brkClock"); if(el){ const s=Math.max(0,Math.ceil(rem/1000)); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
    if (!b.paused && rem<=0){ b.over=true; render(); }
  }
}

/* ---------- Ruleta ---------- */
const MAIN = [
  {k:"gana", label:"Ganar dinero", w:35, c:"--w1"},
  {k:"pierde", label:"Perder dinero", w:30, c:"--w2"},
  {k:"ficha", label:"Perder ficha", w:30, c:"--w3"},
  {k:"robo", label:"Robar ficha", w:5, c:"--w4"},
];
function wheelSegs(){
  const R=S.rul; if(!R) return null;
  if (R.stage==="main") return MAIN.map(m=>({label:m.label, w:m.w, c:m.c}));
  if (R.stage==="sub") return R.sub.items.map((it,i)=>({label:it.label, w:1, c:i%2?"--s2":"--s1"}));
  return UI.lastSegs;
}
function weighted(segs){ const tot=segs.reduce((s,x)=>s+x.w,0); let r=Math.random()*tot; for(let i=0;i<segs.length;i++){ r-=segs[i].w; if(r<0) return i; } return segs.length-1; }
function drawWheel(cv, segs, rot){
  const css=getComputedStyle(document.documentElement); const dpr=window.devicePixelRatio||1;
  const size=cv.clientWidth||300; cv.width=size*dpr; cv.height=size*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); const r=size/2; const tot=segs.reduce((s,x)=>s+x.w,0);
  ctx.translate(r,r); ctx.rotate(rot); let a=-Math.PI/2;
  segs.forEach(s=>{ const span=s.w/tot*Math.PI*2; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r-4,a,a+span); ctx.closePath();
    ctx.fillStyle=css.getPropertyValue(s.c).trim(); ctx.fill(); ctx.strokeStyle=css.getPropertyValue("--surface").trim(); ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.rotate(a+span/2); ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillStyle="#FFFFFF";
    const fs = Math.max(10, Math.min(16, span*r*0.35)); ctx.font=`700 ${fs}px Archivo, sans-serif`;
    let t=s.label; while(ctx.measureText(t).width > r*0.68 && t.length>3) t=t.slice(0,-2)+"…";
    ctx.fillText(t, r-16, 0); ctx.restore(); a+=span; });
  ctx.beginPath(); ctx.arc(0,0,r*0.13,0,Math.PI*2); ctx.fillStyle=css.getPropertyValue("--surface").trim(); ctx.fill();
}
function drawWheelIfAny(){ const cv=$("#wheel"); const segs=wheelSegs(); if(cv&&segs) drawWheel(cv,segs,UI.rot); }
function spin(){
  if (UI.spinning) return; const segs=wheelSegs(); if(!segs) return;
  const idx = S.rul.stage==="main" ? weighted(segs) : Math.floor(Math.random()*segs.length);
  const tot=segs.reduce((s,x)=>s+x.w,0); let start=0; for(let i=0;i<idx;i++) start+=segs[i].w/tot*Math.PI*2;
  const span=segs[idx].w/tot*Math.PI*2; const target = start + span*(0.2+Math.random()*0.6);
  const from=UI.rot; let delta = ((-target - from) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  const to = from + delta + Math.PI*2*(reduced?1:5); const dur = reduced?500:4200; const t0=performance.now();
  UI.lastSegs=segs; UI.spinning=true; const btn=$("#spinBtn"); if(btn) btn.disabled=true;
  const cv=$("#wheel"); let lastSeg=-1;
  const segAt = rot => { let a=((-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2), acc=0; for(let i=0;i<segs.length;i++){ acc+=segs[i].w/tot*Math.PI*2; if(a<acc) return i; } return 0; };
  const step = t => { const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3); UI.rot=from+(to-from)*e; drawWheel(cv,segs,UI.rot); const sg=segAt(UI.rot); if(sg!==lastSeg){ lastSeg=sg; Music.click(); }
    if (k<1) requestAnimationFrame(step); else { UI.spinning=false; UI.rot = to % (Math.PI*2); onSpinEnd(idx); } };
  requestAnimationFrame(step);
}
function onSpinEnd(idx){
  const R=S.rul; const p=P(R.order[R.idx]);
  if (R.stage==="main"){
    const k=MAIN[idx].k;
    if (k==="gana"){ const amt=nice(S.cash0*pick([.05,.1,.15,.2])); p.cash+=amt; R.result=`${p.name} gana ${fmt(amt)}.`; R.stage="done"; log("Ruleta", `${p.name} gana ${fmt(amt)} en la ruleta.`); }
    else if (k==="pierde"){ const amt=Math.min(p.cash, nice(S.cash0*pick([.05,.1,.15,.2]))); p.cash-=amt; R.result=amt?`${p.name} pierde ${fmt(amt)}.`:`${p.name} tenía que perder dinero, pero no tiene efectivo.`; R.stage="done"; log("Ruleta", `${p.name} pierde ${fmt(amt)} en la ruleta.`); }
    else if (k==="ficha"){
      if (!p.fichas.length){ R.result=`${p.name} tenía que perder una ficha, pero no tiene ninguna. Se salva.`; R.stage="done"; log("Ruleta", `${p.name} sacó "Perder ficha" sin tener fichas.`); }
      else { R.stage="sub"; R.sub={kind:"pierde", title:`Ruleta de fichas de ${p.name}: la que salga vuelve al mercado`, items:p.fichas.map(id=>({id, label:F(id).name}))}; R.result=`Perder ficha. Ahora gira la ruleta con las fichas de ${p.name}.`; }
    } else {
      const vict=S.postores.filter(x=>x.id!==p.id && x.fichas.length);
      if (!vict.length){ R.result=`¡Robo! Pero ningún otro postor tiene fichas. No hay nada que robar.`; R.stage="done"; log("Ruleta", `${p.name} sacó "Robar" pero nadie más tenía fichas.`); }
      else { R.stage="sub"; R.sub={kind:"victima", title:`¿A quién le roba ${p.name}?`, items:vict.map(v=>({id:v.id, label:v.name}))}; R.result=`¡Robar ficha! Gira la ruleta de postores para ver a quién le roba ${p.name}.`; }
    }
  } else {
    const it=R.sub.items[idx];
    if (R.sub.kind==="pierde"){
      const f=F(it.id); p.fichas=p.fichas.filter(x=>x!==f.id); f.owner=null; S.market.push(f.id);
      R.result=`${p.name} pierde a ${f.name}. Vuelve al mercado.`; R.stage="done"; log("Ficha perdida", `${p.name} pierde a ${f.name} en la ruleta; vuelve al mercado.`);
    } else if (R.sub.kind==="victima"){
      const v=P(it.id); R.sub={kind:"botin", victim:v.id, title:`Ruleta de fichas de ${v.name}: ${p.name} se lleva la que salga`, items:v.fichas.map(id=>({id, label:F(id).name}))};
      R.result=`${p.name} le roba a ${v.name}. Gira para ver qué ficha se lleva.`;
    } else {
      const v=P(R.sub.victim); const f=F(it.id); v.fichas=v.fichas.filter(x=>x!==f.id); p.fichas.push(f.id); f.owner=p.id; f.acq="robo"; f.paid=0;
      R.result=`¡${p.name} le roba ${f.name} a ${v.name}!`; R.stage="done"; log("Robo", `${p.name} le roba ${f.name} a ${v.name} en la ruleta${f.mkt!=null?` (mercado ${fmt(f.mkt)})`:""}.`);
    }
  }
  if (R.stage!=="done") UI.rot=0; render();
}
function nextSpinner(){ const R=S.rul; R.idx++; R.stage="main"; R.sub=null; R.result=null; UI.rot=0; UI.lastSegs=null; if(R.idx>=R.order.length){ S.rul=null; finishEvent(); } else render(); }
function finishEvent(){ if (S.pending.length) continueFlow(); else render(); }
function viewRuleta(){
  const R=S.rul; const p=P(R.order[R.idx]); const segs=wheelSegs();
  const order=`<div class="order">${R.order.map((id,i)=>`<span class="${i<R.idx?"done":i===R.idx?"now":""}">${esc(P(id).name)}</span>`).join("")}</div>`;
  const legend = R.stage==="main" ? `<div class="legend">${MAIN.map(m=>`<div><i style="background:var(${m.c})"></i>${m.label} <span class="muted mono">${m.w}%</span></div>`).join("")}</div>` : `<p class="eyebrow" style="margin:0">${esc(R.sub?.title||"")}</p>`;
  const last = R.idx===R.order.length-1;
  return `<div class="sheet"><div class="row"><div><div class="eyebrow">Ruleta nº ${S.rulRound} · tras la venta ${S.sales}</div><h2>Gira ${esc(p.name)}</h2></div><span class="spacer"></span><span class="pcash">${fmt(p.cash)} · ${p.fichas.length} fichas</span></div>
    ${order}

    <div style="display:flex;flex-direction:column;gap:14px">${legend}${R.result?`<div class="result">${esc(R.result)}</div>`:""}
      <div class="row">${R.stage!=="done"?`<button class="brass big" id="spinBtn" data-act="spin">Girar ruleta</button>`:`<button class="primary big" data-act="nextSpinner">${last?"Terminar ruleta":"Siguiente postor →"}</button>`}</div></div></div></div>`;
}

/* ---------- Intercambios ---------- */
function newTrade(){ const ps=S.postores; return {a:ps[0].id, b:ps[1].id, aF:[], bF:[], aM:0, bM:0, aOK:false, bOK:false}; }
function tradeSummary(T){
  const A=P(T.a), B=P(T.b);
  const side = (fs,m) => [...fs.map(id=>F(id).name), m>0?fmt(m):null].filter(Boolean).join(" + ") || "nada";
  return `${A.name} entrega ${side(T.aF,T.aM)} a ${B.name}; ${B.name} entrega ${side(T.bF,T.bM)} a ${A.name}`;
}
function tradeError(T){
  if (T.a===T.b) return "Elige dos postores distintos.";
  if (!T.aF.length && !T.bF.length && !T.aM && !T.bM) return "El intercambio está vacío.";
  if (T.aM>P(T.a).cash) return `${P(T.a).name} no tiene ${fmt(T.aM)}.`;
  if (T.bM>P(T.b).cash) return `${P(T.b).name} no tiene ${fmt(T.bM)}.`;
  return "";
}
function execTrade(){
  const T=UI.T; if(!T || S.brk.over) return; const e=tradeError(T); if(e || !T.aOK || !T.bOK) return;
  const A=P(T.a), B=P(T.b);
  T.aF.forEach(id=>{ A.fichas=A.fichas.filter(x=>x!==id); B.fichas.push(id); const f=F(id); f.owner=B.id; f.acq="intercambio"; f.paid=0; });
  T.bF.forEach(id=>{ B.fichas=B.fichas.filter(x=>x!==id); A.fichas.push(id); const f=F(id); f.owner=A.id; f.acq="intercambio"; f.paid=0; });
  A.cash += T.bM - T.aM; B.cash += T.aM - T.bM;
  S.trades++; const txt=tradeSummary(T); S.brk.done.push(txt);
  log("Intercambio", `Intercambio nº ${S.trades}: ${txt}. Confirmado por ${A.name} y ${B.name}.`);
  UI.T=newTrade(); UI.T.a=A.id; UI.T.b=B.id; render();
}
function sellPrice(f){ return f.mkt ?? f.value ?? 0; }
function viewSell(){
  const U=UI.sell=UI.sell||{pid:S.postores[0].id, fid:"", ok:false};
  if (!P(U.pid)) U.pid=S.postores[0].id;
  const p=P(U.pid); if (U.fid && !p.fichas.includes(U.fid)) { U.fid=""; U.ok=false; }
  const f=U.fid?F(U.fid):null; const price=f?sellPrice(f):0;
  return `<div class="side" style="gap:12px"><div><div class="eyebrow">Vender al mercado</div><p class="muted" style="margin:4px 0 0;font-size:13px">El postor recibe el precio de mercado de la ficha y la ficha vuelve al mercado para subastarse otra vez.</p></div>
    <div class="row" style="align-items:flex-end">
      <label style="flex:1 1 160px">Postor<select id="s-p" data-in="sp">${S.postores.map(x=>`<option value="${x.id}" ${x.id===U.pid?"selected":""}>${esc(x.name)} · ${fmt(x.cash)}</option>`).join("")}</select></label>
      <label style="flex:2 1 220px">Ficha<select id="s-f" data-in="sf"><option value="">${p.fichas.length?"Elegir ficha…":"Sin fichas"}</option>${p.fichas.map(id=>{const x=F(id);return `<option value="${id}" ${id===U.fid?"selected":""}>${esc(x.name)} · ${x.mkt!=null?`mercado ${fmt(x.mkt)}`:`sin precio, pagó ${fmt(x.value||0)}`}</option>`}).join("")}</select></label>
    </div>
    ${f?`<div class="summary">${esc(p.name)} vende a ${esc(f.name)} y recibe <b class="mono">${fmt(price)}</b>${f.mkt==null?" (no tiene precio de mercado, se usa lo que se pagó en la subasta)":""}.</div>
    <div class="row"><label class="confirm" style="flex:1 1 200px"><input type="checkbox" data-in="sok" ${U.ok?"checked":""}> ${esc(p.name)} confirma la venta</label><button class="brass big" data-act="sellF" ${U.ok?"":"disabled"}>Vender por ${fmt(price)}</button></div>`:""}</div>`;
}
function sellFicha(){
  const U=UI.sell; if(!U?.ok || S.brk?.over) return; const p=P(U.pid), f=F(U.fid); if(!p||!f||!p.fichas.includes(f.id)) return;
  const price=sellPrice(f); p.fichas=p.fichas.filter(x=>x!==f.id); p.cash+=price; f.owner=null; S.market.push(f.id);
  const txt=`${p.name} vende a ${f.name} al mercado por ${fmt(price)}; vuelve al mercado`;
  S.brk.done.push(txt); log("Venta al mercado", txt+".");
  if (UI.T){ UI.T.aF=UI.T.aF.filter(x=>x!==f.id); UI.T.bF=UI.T.bF.filter(x=>x!==f.id); UI.T.aOK=UI.T.bOK=false; }
  UI.sell={pid:p.id, fid:"", ok:false}; render();
}

    <div><div class="eyebrow">Entrega fichas</div><div class="checks">${P0.fichas.length?P0.fichas.map(id=>`<label><input type="checkbox" data-in="tf" data-k="${key}" data-id="${id}" ${fs.includes(id)?"checked":""}>${esc(F(id).name)}${hasMarket()?` <span class="muted mono" style="font-size:12px">${F(id).mkt!=null?fmt(F(id).mkt):"—"}</span>`:""}</label>`).join(""):`<span class="muted" style="font-size:13px">Sin fichas</span>`}</div></div>
    <label>Entrega dinero<input id="t-${key}M" type="number" min="0" step="1" data-in="tm" data-keep="no" data-k="${key}" value="${m||""}" placeholder="0"></label>

    ${b.over?`<div class="result">Se acabó el tiempo. Ya no se pueden cerrar más intercambios.</div>`:`<p class="muted" style="margin:0">La casa de subasta arma el trato. Los dos postores deben confirmar antes de ejecutarlo. Cambiar algo borra las confirmaciones.</p>`}
    ${b.over?"":`<div class="trade">${side("a",A,T.aF,T.aM,T.aOK)}${side("b",B,T.bF,T.bM,T.bOK)}</div>
    <div class="summary">${esc(tradeSummary(T))}.</div>
    <div class="row"><span class="err">${esc(err || (!T.aOK||!T.bOK?"Faltan las confirmaciones de ambos postores.":""))}</span><span class="spacer"></span><button class="primary big" data-act="execTrade" ${err||!T.aOK||!T.bOK?"disabled":""}>Ejecutar intercambio</button></div>`}
    ${b.over?"":viewSell()}
    ${b.done.length?`<div><div class="eyebrow">Hechos en este descanso</div><ol style="margin:6px 0 0;padding-left:20px">${b.done.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`:""}
    <div class="row"><button data-act="brkPause" ${b.over?"disabled":""}>${b.paused?"Reanudar reloj":"Pausar reloj"}</button><span class="spacer"></span><button class="brass big" data-act="endBreak">Volver a la subasta →</button></div></div>`;
}

/* ---------- Final ---------- */
function rankList(items){ // items: [{id, val}], mayor es mejor → [{id,val,rank}]
  const s=[...items].sort((a,b)=>b.val-a.val); let last=null, rank=0;
  return s.map((x,i)=>{ if(x.val!==last){ rank=i+1; last=x.val; } return {...x, rank}; });
}
function capitalOf(p){ return p.cash + p.fichas.reduce((s,id)=>s+valueOf(F(id)),0); }
function voters(){ return [...S.postores.map(p=>({id:p.id, name:p.name})), {id:"casa", name:"Casa de Subasta"}]; }
function viewFinal(){
  const fin=S.fin; const vs=voters(); const allVoted = vs.every(v=>fin.votes[v.id]);
  const counts={}; S.postores.forEach(p=>counts[p.id]=0); Object.values(fin.votes).forEach(t=>{ if(counts[t]!=null) counts[t]++; });
  const voteR = rankList(S.postores.map(p=>({id:p.id, val:counts[p.id]})));
  const capR = rankList(S.postores.map(p=>({id:p.id, val:capitalOf(p)})));
  const aiR = fin.ai ? rankList(fin.ai.ranking.map(r=>({id:r.id, val:-r.puesto}))) : null;
  const top = r => r.filter(x=>x.rank===1).map(x=>esc(P(x.id).name)).join(" y ");

  const voteBox = `<div class="panel cat"><div class="eyebrow">Categoría 1</div><h2 class="display" style="font-size:28px">Votación</h2>
    <p class="muted" style="margin:0;font-size:13px">Cada postor vota por otro postor. La casa de subasta también vota.</p>
    <div class="votes">${vs.map(v=>`<label>${esc(v.name)}<select id="v-${v.id}" data-in="vote" data-id="${v.id}"><option value="">Elegir…</option>${S.postores.filter(p=>p.id!==v.id).map(p=>`<option value="${p.id}" ${fin.votes[v.id]===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>`).join("")}</div>
    ${allVoted?`<div class="winner">${top(voteR)}</div><table><tbody>${voteR.map(x=>`<tr><td class="n">${x.rank}º</td><td>${esc(P(x.id).name)}</td><td class="n">${x.val} ${x.val===1?"voto":"votos"}</td></tr>`).join("")}</tbody></table>`:`<p class="muted" style="margin:0">Faltan ${vs.filter(v=>!fin.votes[v.id]).length} votos.</p>`}</div>`;

  const capBox = `<div class="panel cat"><div class="eyebrow">Categoría ${isSport()?3:2}</div><h2 class="display" style="font-size:28px">Mayor capital</h2>
    <p class="muted" style="margin:0;font-size:13px">${isSport()?"Valor de mercado de sus fichas + efectivo final.":"Precio de mercado de sus fichas (o lo que pagó, si la casa no le puso precio) + efectivo final."}</p>
    <div class="winner">${top(capR)}</div><table><tbody>${capR.map(x=>{const p=P(x.id);return `<tr><td class="n">${x.rank}º</td><td>${esc(p.name)}</td><td class="n">${fmt(x.val)}<br><span class="muted" style="font-size:11px">${fmt(p.cash)} efectivo</span></td></tr>`}).join("")}</tbody></table></div>`;

  let aiBox="";
  if (isSport()){
    aiBox = `<div class="panel cat"><div class="eyebrow">Categoría 2</div><h2 class="display" style="font-size:28px">Ranking del analista</h2>
      ${fin.ai?`<div class="winner">${top(aiR)}</div>${fin.ai.auto?`<span class="chip">Según la calidad, posiciones y banca de cada equipo</span>`:""}<div>${[...fin.ai.ranking].sort((a,b)=>a.puesto-b.puesto).map(r=>`<div class="ai-item"><b>${r.puesto}º</b> <strong>${esc(P(r.id).name)}</strong> <span class="chip">${r.nota}/10</span><div class="muted" style="font-size:14px;margin-top:4px">${esc(r.comentario)}</div></div>`).join("")}</div>${fin.ai.resumen?`<p style="margin:0">${esc(fin.ai.resumen)}</p>`:""}${fin.ai.auto?"":`<div><button class="sm ghost" data-act="askAI">Pedir otra opinión</button></div>`}`
      :`<p class="muted" style="margin:0;font-size:13px">El analista evalúa cada equipo: calidad, equilibrio por posiciones y si alcanza para un ${THEMES[S.theme].unit}.</p>
        <div class="row"><button class="brass" data-act="askAI" ${fin.aiBusy?"disabled":""}>${fin.aiBusy?"El analista está evaluando los equipos…":"Pedir ranking al analista"}</button></div>
        ${fin.aiErr?`<p class="err" style="margin:0">${esc(fin.aiErr)}</p><div><button class="sm" data-act="autoAI">Usar ranking automático</button></div>`:""}`}</div>`;
  }

  const cats=[{k:"votos", name:"Votación", r:allVoted?voteR:null}]; if(isSport()) cats.push({k:"ia", name:"Analista", r:aiR}); cats.push({k:"cap", name:"Capital", r:capR});
  const n=S.postores.length; const ready=cats.filter(c=>c.r);
  const gen = rankList(S.postores.map(p=>{ let pts=0; ready.forEach(c=>{ const x=c.r.find(y=>y.id===p.id); pts+=n-x.rank+1; }); return {id:p.id, val:pts*1e9+capitalOf(p)}; }));
  const pending = cats.filter(c=>!c.r).map(c=>c.name);
  const genBox = `<div class="panel" style="display:flex;flex-direction:column;gap:12px"><div class="eyebrow">Ranking de postores</div><h2 class="display" style="font-size:34px">Clasificación general</h2>

    ${gen.map(g=>{const p=P(g.id); let pts=0; return `<tr><td class="n">${g.rank}º</td><td><b>${esc(p.name)}</b><br><span class="muted" style="font-size:12px">${p.fichas.map(id=>F(id).name).join(", ")||"sin fichas"}</span></td>${cats.map(c=>{ if(!c.r) return `<td class="n muted">—</td>`; const x=c.r.find(y=>y.id===p.id); pts+=n-x.rank+1; return `<td class="n">${x.rank}º</td>`; }).join("")}<td class="n"><b>${pts}</b></td></tr>`}).join("")}</tbody></table></div></div>`;

/* ---------- Analista automático: arma el mejor titular posible y evalúa titulares, banca y estrellas ---------- */
const FORMATIONS = {"4-3-3":{POR:1,DEF:4,MED:3,DEL:3}, "4-4-2":{POR:1,DEF:4,MED:4,DEL:2}, "3-5-2":{POR:1,DEF:3,MED:5,DEL:2}, "4-2-4":{POR:1,DEF:4,MED:2,DEL:4}};
const NBA_POS = ["Base","Escolta","Alero","Ala-pívot","Pívot"];
const LINE_NAMES = {POR:"la portería", DEF:"la defensa", MED:"el medio campo", DEL:"el ataque", Base:"la dirección", Escolta:"el perímetro", Alero:"las alas", "Ala-pívot":"el juego interior", "Pívot":"la pintura"};
const MISSING = {POR:"no tiene portero de verdad", DEF:"le faltan defensas", MED:"le faltan mediocampistas", DEL:"le faltan delanteros", Base:"no tiene base que organice", Escolta:"le falta un escolta", Alero:"le falta un alero", "Ala-pívot":"le falta un ala-pívot", "Pívot":"no tiene pívot"};
function outOfPosPenalty(from, to){
  if (S.theme==="futbol"){
    if (from===to) return 0;
    if (to==="POR" || from==="POR") return 30;
    return Math.abs(["DEF","MED","DEL"].indexOf(from)-["DEF","MED","DEL"].indexOf(to))===1 ? 7 : 14;
  }
  const d=Math.abs(NBA_POS.indexOf(from)-NBA_POS.indexOf(to)); return [0,4,10,16,20][d] ?? 20;
}
function buildLineup(players, slots){
  const pool=[...players].sort((a,b)=>b.r-a.r); const filled=[]; const need={...slots};
  for (const f of [...pool]) if (need[f.pos]>0){ need[f.pos]--; filled.push({f, slot:f.pos, val:f.r}); pool.splice(pool.indexOf(f),1); }
  const holes=[];
  for (const slot in need) for (let i=0;i<need[slot];i++){
    let best=null; pool.forEach(f=>{ const v=f.r-outOfPosPenalty(f.pos,slot); if(!best || v>best.v) best={f,v}; });
    if (best && best.v>50){ filled.push({f:best.f, slot, val:best.v, out:true}); pool.splice(pool.indexOf(best.f),1); }
    else { filled.push({f:null, slot, val:45}); holes.push(slot); }
  }
  return {filled, bench:pool, holes, total:filled.reduce((s,x)=>s+x.val,0)};
}
function analyze(p){
  const players=p.fichas.map(F).map(f=>({...f, r:f.r??70, pos:f.pos||(S.theme==="futbol"?"MED":"Alero")}));
  let best=null, form=null;
  if (S.theme==="futbol") for (const [k,sl] of Object.entries(FORMATIONS)){ const l=buildLineup(players, sl); if(!best || l.total>best.total){ best=l; form=k; } }
  else best=buildLineup(players, Object.fromEntries(NBA_POS.map(x=>[x,1])));
  const starters=best.filled.length; const startAvg=best.total/starters;
  const benchN=S.theme==="futbol"?5:5; const bench=best.bench.slice(0,benchN);
  const benchAvg=(bench.reduce((s,f)=>s+f.r,0)+(benchN-bench.length)*55)/benchN;
  const top3=[...players].sort((a,b)=>b.r-a.r).slice(0,3); const starAvg=(top3.reduce((s,f)=>s+f.r,0)+(3-top3.length)*50)/3;
  const score=0.68*startAvg+0.14*benchAvg+0.18*starAvg;
  // líneas
  const lines={}; best.filled.forEach(x=>{ const k=x.slot; (lines[k]=lines[k]||[]).push(x.val); });
  const lineAvg=Object.entries(lines).map(([k,v])=>({k, avg:v.reduce((a,b)=>a+b,0)/v.length}));
  const strong=[...lineAvg].sort((a,b)=>b.avg-a.avg)[0]; const weak=[...lineAvg].sort((a,b)=>a.avg-b.avg)[0];
  return {id:p.id, p, players, score, nota:Math.max(0,Math.min(10,Math.round((score-55)/40*100)/10)), form, best, bench, benchAvg, strong, weak, star:top3[0], legends:players.filter(f=>f.legend).length, outs:best.filled.filter(x=>x.out).length};
}
function commentFor(a, puesto, n){
  const unit=THEMES[S.theme].unit;
  if (!a.players.length) return "No compró jugadores, así que no puede competir.";
  const parts=[];
  const lead = puesto===1 ? "Es el equipo más completo" : puesto===n ? "Es el equipo con más carencias" : "Es un equipo competitivo";
  const formTxt = a.form ? ` en ${a.form}` : "";
  parts.push(`${lead}${formTxt}: ${a.star.name} es su gran figura y su punto fuerte es ${LINE_NAMES[a.strong.k]}${a.legends?` (con ${a.legends} ${a.legends===1?"leyenda":"leyendas"})`:""}.`);
  if (a.best.holes.length){ const uniq=[...new Set(a.best.holes)]; parts.push(`Su gran problema es que ${uniq.map(h=>MISSING[h]).join(" y ")}, así que no completa el ${unit}.`); }
  else if (a.outs) parts.push(`Completa el ${unit}, pero ${a.outs===1?"un jugador juega":`${a.outs} jugadores juegan`} fuera de su posición y se nota en ${LINE_NAMES[a.weak.k]}.`);
  else if (a.bench.length<3) parts.push(`Tiene buen ${unit}, pero la banca es muy corta si hay lesiones.`);
  else parts.push(a.weak.k!==a.strong.k?`Lo más flojo está en ${LINE_NAMES[a.weak.k]}, aunque tiene banca para rotar.`:`Además tiene banca de calidad para rotar.`);
  return parts.join(" ");
}
function autoAI(){
  const an=S.postores.map(analyze);
  const r=rankList(an.map(a=>({id:a.id, val:a.score}))); const n=an.length;
  const ranking=r.map((x,i)=>{ const a=an.find(y=>y.id===x.id); return {id:x.id, puesto:i+1, nota:a.nota, comentario:commentFor(a,i+1,n)}; });
  const first=an.find(a=>a.id===ranking[0].id), second=an.find(a=>a.id===ranking[1]?.id);
  const gap=second?first.score-second.score:0;
  const resumen = !first.players.length ? "Nadie armó un equipo competitivo." :
    `${first.p.name} gana ${gap<1.5?"por muy poco":gap<4?"con claridad":"con mucha ventaja"} gracias a ${first.best.holes.length?"sus estrellas":`un ${THEMES[S.theme].unit} más sólido`}${second?`; ${second.p.name} queda segundo`:""}.`;
  S.fin.ai={auto:true, ranking, resumen};
  log("Ranking", `El analista ordena los equipos: ${ranking.map(x=>`${x.puesto}º ${P(x.id).name}`).join(", ")}.`);
  S.fin.aiErr=""; render();
}

function validateStep(){
  if (S.step===1 && !S.theme) return "Elige una temática.";
  if (S.step===2 && S.theme!=="libre" && !S.selected.length) return "Selecciona al menos un jugador.";

  if (S.step===3){
    S.postores.forEach(p=>p.name=p.name.trim());
    if (S.postores.length<2) return "Añade al menos 2 postores.";
    if (S.postores.some(p=>!p.name)) return "Todos los postores necesitan nombre.";
    const names=S.postores.map(p=>p.name.toLowerCase()); if(new Set(names).size!==names.length) return "Hay dos postores con el mismo nombre.";
  }
  if (S.step===4 && !(S.cash0>=1)) return "El dinero inicial debe ser mayor que 0.";

}

  pat:`<svg xmlns="http://www.w3.org/2000/svg" width="190" height="190" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(48 50) rotate(-35)"><rect x="-24" y="-10" width="48" height="20" rx="4"/><path d="M-24 -4h48M-24 4h48"/><rect x="-3.5" y="10" width="7" height="42" rx="3.5"/></g><rect x="20" y="88" width="46" height="9" rx="3"/><circle cx="140" cy="118" r="21"/><rect x="135.5" y="139" width="9" height="34" rx="4.5"/><text x="140" y="126" font-size="22" font-weight="700" font-family="sans-serif" text-anchor="middle" fill="#000" stroke="none">7</text><text x="142" y="52" font-size="30" font-weight="700" font-family="sans-serif" text-anchor="middle" fill="#000" stroke="none">$</text><path d="M44 150l8 8-8 8-8-8z"/></svg>`,
  futbol:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680" fill="none" stroke="#000" stroke-width="5"><rect x="5" y="5" width="1040" height="670"/><path d="M525 5v670"/><circle cx="525" cy="340" r="91.5"/><circle cx="525" cy="340" r="5" fill="#000"/><rect x="5" y="138.5" width="165" height="403"/><rect x="5" y="248.5" width="55" height="183"/><circle cx="115" cy="340" r="5" fill="#000"/><path d="M170 267a91.5 91.5 0 0 1 0 146"/><rect x="880" y="138.5" width="165" height="403"/><rect x="990" y="248.5" width="55" height="183"/><circle cx="935" cy="340" r="5" fill="#000"/><path d="M880 267a91.5 91.5 0 0 0 0 146"/><path d="M5 15a10 10 0 0 0 10-10M1035 5a10 10 0 0 0 10 10M5 665a10 10 0 0 1 10 10M1035 675a10 10 0 0 1 10-10"/></svg>`,
  basket:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" fill="none" stroke="#000" stroke-width="5"><rect x="5" y="5" width="930" height="490"/><path d="M470 5v490"/><circle cx="470" cy="250" r="60"/><circle cx="470" cy="250" r="20"/><rect x="5" y="170" width="190" height="160"/><circle cx="195" cy="250" r="60"/><path d="M5 30h140a237.5 237.5 0 0 1 0 440H5"/><circle cx="57" cy="250" r="9"/><path d="M45 220v60"/><rect x="745" y="170" width="190" height="160"/><circle cx="745" cy="250" r="60"/><path d="M935 30H795a237.5 237.5 0 0 0 0 440h140"/><circle cx="883" cy="250" r="9"/><path d="M895 220v60"/></svg>`,
  libre:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><g transform="translate(300 170) rotate(-30)"><rect x="-120" y="-48" width="240" height="96" rx="16"/><path d="M-120 -22h240M-120 22h240"/><rect x="-14" y="48" width="28" height="190" rx="14"/></g><rect x="150" y="330" width="300" height="44" rx="10"/><path d="M190 352h220"/></svg>`,
};
const svgUrl = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
function paintBg(){ const bg=$("#bg"); if(!bg) return; bg.style.setProperty("--pat", svgUrl(SVG.pat)); const f=SVG[S.theme]; bg.style.setProperty("--field", f?svgUrl(f):"none"); }

/* ---------- Música de suspenso (sintetizada en el navegador) ---------- */
const Music = (()=>{
  let ctx=null, master, bus, filt, on=false, timer=null, nextBeat=0, beat=0, vol=0.6, noiseBuf;
  function init(){
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(master);
    const delay=ctx.createDelay(1); delay.delayTime.value=0.31; const fb=ctx.createGain(); fb.gain.value=0.25; const wet=ctx.createGain(); wet.gain.value=0.16;
    bus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
    filt = ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=320; filt.Q.value=7;
    const dg=ctx.createGain(); dg.gain.value=0.06; filt.connect(dg); dg.connect(bus);
    [[73.42,"sawtooth"],[73.95,"sawtooth"],[110,"triangle"],[36.71,"sine"]].forEach(([f,t])=>{ const o=ctx.createOscillator(); o.type=t; o.frequency.value=f; o.connect(filt); o.start(); });
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.06; const lg=ctx.createGain(); lg.gain.value=160; lfo.connect(lg); lg.connect(filt.frequency); lfo.start();
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate*0.2, ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  function env(t,dur,peak){ const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); g.connect(bus); return g; }
  function thump(t,l){ const o=ctx.createOscillator(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+0.2); o.connect(env(t,0.32,0.6*l)); o.start(t); o.stop(t+0.35); }
  function tick(t,l,hi){ const o=ctx.createOscillator(); o.type="square"; o.frequency.value=hi?2600:1700; const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=1200; o.connect(f); f.connect(env(t,0.035,0.05*l)); o.start(t); o.stop(t+0.05); }
  function tone(t,fr,dur,l,type="triangle"){ const o=ctx.createOscillator(); o.type=type; o.frequency.value=fr; o.connect(env(t,dur,0.05*l)); o.start(t); o.stop(t+dur+0.05); }
  function knock(t,l){ const n=ctx.createBufferSource(); n.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=850; f.Q.value=3; n.connect(f); f.connect(env(t,0.12,0.9*l)); n.start(t); n.stop(t+0.15); thump(t,l*1.2); }
  // Ostinato rápido en Re menor: Rem – Sib – Solm – La (i–VI–iv–V), bajo en corcheas y arpegio en semicorcheas
  const N = m => 440*Math.pow(2,(m-69)/12);
  const ROOTS=[38,34,31,33], CH=[[62,65,69,74],[58,62,65,70],[55,58,62,67],[57,61,64,69]], ARP=[0,1,2,3,2,1,2,3,0,1,2,3,3,2,1,0];
  function bass(t,m,dur,l){ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=N(m); const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(1100,t); f.frequency.exponentialRampToValueAtTime(160,t+dur); o.connect(f); f.connect(env(t,dur,0.18*l)); o.start(t); o.stop(t+dur+0.05); }
  function noise(t,type,freq,dur,peak){ const n=ctx.createBufferSource(); n.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; n.connect(f); f.connect(env(t,dur,peak)); n.start(t); n.stop(t+dur+0.02); }
  function level(){
    const c=S.cur;
    if (S.phase==="game" && c?.open && !c.paused) return (c.deadline-now())<2200 ? 2 : 1;
    if (S.phase==="game" && S.brk && !S.brk.over && !S.brk.paused) return (S.brk.deadline-now())<15000 ? 2 : 1;
    if (S.phase==="game" && S.rul) return 1;
    return 0;
  }
  function schedule(){
    const lvl=level(); const s16=60/[118,142,176][lvl]/4;
    if (nextBeat < ctx.currentTime) nextBeat = ctx.currentTime+0.05;
    while (nextBeat < ctx.currentTime+0.12){
      const t=nextBeat, st=beat%16, bar=Math.floor(beat/16)%4;
      if (st%4===0) thump(t, lvl?1.1:0.75);
      if (st%2===0) bass(t, ROOTS[bar]+(st%8===4?12:0), s16*1.7, lvl?1:0.75);
      if (lvl>0 || st%2===0) tone(t, N(CH[bar][ARP[st]]), s16*0.9, lvl?0.85:0.6, lvl?"square":"triangle");
      if (st%4===2) noise(t,"highpass",7000,0.03,lvl?0.14:0.08);
      if (lvl===2 && st%2===1) noise(t,"highpass",8000,0.025,0.09);
      if (lvl>0 && (st===4||st===12)) noise(t,"bandpass",1800,0.12,lvl===2?0.45:0.28);
      if (lvl===2 && st%4===0){ tone(t,N(86),0.12,1.4,"sawtooth"); tone(t,N(87),0.12,1.1,"sawtooth"); }
      if (st===0 && bar===3 && lvl>0) tone(t,N(81),s16*14,0.7,"sawtooth");
      beat++; nextBeat+=s16;
    }
    filt.frequency.setTargetAtTime([260,420,800][lvl], ctx.currentTime, 0.6);
  }
  function apply(){ if(!ctx) return; master.gain.setTargetAtTime(on?vol*0.55:0, ctx.currentTime, 0.4); }
  return {
    get on(){ return on; },
    toggle(){ if(!ctx) init(); ctx.resume?.(); on=!on; apply(); clearInterval(timer); if(on){ nextBeat=ctx.currentTime+0.1; timer=setInterval(schedule,25); } else setTimeout(()=>{ if(!on) ctx.suspend?.(); },800); return on; },
    volume(v){ vol=v; apply(); },
    gavel(){ if(!on) return; const t=ctx.currentTime+0.03; knock(t,1); knock(t+0.22,1); knock(t+0.5,1.3); },
    click(){ if(!on) return; tick(ctx.currentTime+0.005, 2.5, true); },
  };
})();
function syncMusicBtn(){ const b=$("#musicBtn"); b.classList.toggle("on",Music.on); b.setAttribute("aria-pressed",String(Music.on)); $("#musicLbl").textContent=Music.on?"Música: sí":"Música de suspenso"; $("#musicVol").hidden=!Music.on; }
ACT.music=()=>{ Music.toggle(); syncMusicBtn(); try{ localStorage.setItem(KEY+"-musica", Music.on?"1":"0"); }catch(e){} };
document.addEventListener("input", e=>{ if(e.target.id==="musicVol") Music.volume(e.target.value/100); });
try{ if(localStorage.getItem(KEY+"-musica")==="1"){ const once=e=>{ if(!e.target.closest?.("#music") && !Music.on){ Music.toggle(); syncMusicBtn(); } document.removeEventListener("pointerdown",once,true); }; document.addEventListener("pointerdown",once,true); } }catch(e){}

/* ---------- Arranque ---------- */
function start(data){
  const saved = data?.S || load();
  if (saved && saved.v===1){ S=saved; if(S.cur?.open && !S.cur.paused){ S.cur.paused=true; } if(S.brk && !S.brk.paused && !S.brk.over){ S.brk.paused=true; } if(S.fin) S.fin.aiBusy=false; }
  render(); setInterval(tick, 100);
  window.addEventListener("resize", ()=>{ if(!UI.spinning) drawWheelIfAny(); });
}
window.claude?.hot?.snapshot?.(()=>{ save(); return {S}; });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
